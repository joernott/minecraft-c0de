name: Integration

# Starts dedicated servers with the mod in Docker and runs the scenario tests against them.
on:
  push:
    branches: [main, "sprint-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test on dedicated servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 21 for the toolchain of the 1.21.x nodes, 25 for the Gradle daemon (Loom needs Java 25)
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build --console=plain
      - name: Pull the server image
        run: docker pull -q itzg/minecraft-server:java21
      - name: Smoke test
        run: contrib/itest/smoke.sh
        env:
          # Keeps the containers for the log output below
          KEEP_SERVERS: 1
      - name: Server logs
        if: failure()
        run: docker compose -f contrib/docker/compose.yaml logs --tail 200
