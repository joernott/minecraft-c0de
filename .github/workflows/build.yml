name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formatting and interpreter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Whitespace
        run: scripts/check-whitespace.sh
      - name: Formatting and unit tests of core
        run: ./gradlew :core:check --console=plain
      - name: Report failed unit tests
        if: failure()
        run: scripts/ci/report-junit.sh core/build/test-results/test

  core-windows:
    name: Interpreter tests on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests of core
        run: ./gradlew :core:test --console=plain
      - name: Report failed unit tests
        if: failure()
        run: scripts/ci/report-junit.sh core/build/test-results/test

  node:
    name: ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per Stonecutter node (see settings.gradle.kts)
        include:
          - node: 1.21.1-fabric
            gametest: runGametest
          - node: 1.21.1-neoforge
            gametest: runGameTestServer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew :${{ matrix.node }}:build --console=plain
      - name: GameTests
        run: |
          set -o pipefail
          ./gradlew :${{ matrix.node }}:${{ matrix.gametest }} --console=plain 2>&1 | tee gametest.log
      - name: Report failed GameTests
        if: failure()
        run: scripts/ci/report-gametest.sh gametest.log
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: c0de-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error
