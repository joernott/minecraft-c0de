name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Formatting and interpreter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 21 for the toolchain of the 1.21.x nodes, 25 for the Gradle daemon (Loom needs Java 25)
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Whitespace
        run: scripts/check-whitespace.sh
      # Textures are not compared, because PNG compression may differ between zlib versions
      - name: Generated JSON files are up to date
        run: |
          python3 scripts/generate_content.py
          if [ -n "$(git status --porcelain -- src/main/resources)" ]; then
            git status --short -- src/main/resources
            echo "::error title=Generated files::Run scripts/generate_content.py and commit the result"
            exit 1
          fi
      - name: Formatting and unit tests of core
        run: ./gradlew :core:check --console=plain
      - name: Report failed unit tests
        if: failure()
        run: scripts/ci/report-junit.sh core/build/test-results/test

  core-windows:
    name: Interpreter tests on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 21 for the toolchain of the 1.21.x nodes, 25 for the Gradle daemon (Loom needs Java 25)
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests of core
        run: ./gradlew :core:test --console=plain
      - name: Report failed unit tests
        if: failure()
        run: scripts/ci/report-junit.sh core/build/test-results/test

  node:
    name: ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per Stonecutter node (see settings.gradle.kts)
        include:
          - node: 1.21.1-fabric
            gametest: runGametest
          - node: 1.21.1-neoforge
            gametest: runGameTestServer
          - node: 1.21.11-fabric
            gametest: runGametest
          - node: 1.21.11-neoforge
            gametest: runGameTestServer
          - node: 26.1.2-fabric
            gametest: runGametest
          - node: 26.1.2-neoforge
            gametest: runGameTestServer
          - node: 26.2-fabric
            gametest: runGametest
          - node: 26.2-neoforge
            gametest: runGameTestServer
          - node: 26.3-fabric
            gametest: runGametest
          - node: 26.3-neoforge
            gametest: runGameTestServer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 21 for the toolchain of the 1.21.x nodes, 25 for the Gradle daemon (Loom needs Java 25)
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew :${{ matrix.node }}:build --console=plain
      - name: GameTests
        run: scripts/ci/run-gametests.sh :${{ matrix.node }}:${{ matrix.gametest }} gametest.log
      - name: Report failed GameTests
        if: failure()
        run: scripts/ci/report-gametest.sh gametest.log
      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: c0de-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error

  client:
    name: Client GameTests ${{ matrix.node }}
    runs-on: ubuntu-latest
    # A client that can't create its window hangs instead of exiting
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Fabric API has client GameTests since 1.21.4 (task 12.4)
        node: [1.21.11-fabric, 26.1.2-fabric, 26.2-fabric, 26.3-fabric]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - name: Install a virtual display with software rendering
        # OpenGL and Vulkan (lavapipe) in software: 26.3 creates its window with SDL and tries both
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 libegl1
          libegl-mesa0 mesa-vulkan-drivers mesa-utils
      - name: Client GameTests
        # Software rendering in a virtual display; the first line shows the OpenGL driver
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B | grep -E "OpenGL (renderer|core profile version)"
          # Loom starts the client in xvfb-run itself when xvfb is installed
          ./gradlew :${{ matrix.node }}:runClientGameTest --console=plain
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-screenshots-${{ matrix.node }}
          path: versions/${{ matrix.node }}/build/clientGameTest/screenshots/
          if-no-files-found: ignore
